[server]
# 0.0.0.0 = accept connections from other computers on the office network
address = "0.0.0.0"
port = 8501
headless = true
maxUploadSize = 50   # MB
# Don't watch source files for changes (faster, and avoids noisy errors from torch)
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's developer menu so users only see "InfoDeck"
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#7a1f2b"
backgroundColor = "#f4ede1"
secondaryBackgroundColor = "#ebe1d0"
textColor = "#2a1a1c"
# Lato for all text (Playfair Display for the logo and answer line comes from app.css)
font = "Lato:https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap, sans-serif"
